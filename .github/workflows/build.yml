name: Build CrispDuoStatus Rootless

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          brew install dpkg ldid

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz
          mv sdks-master/*.sdk "$HOME/theos/sdks/"
          rm -rf sdks-master

      - name: Build Rootless DEB
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrispDuoStatus-Rootless-Deb
          path: packages/*.deb
